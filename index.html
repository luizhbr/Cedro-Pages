<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedro • Carpintaria &amp; Alvenaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
        .heading-serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
</head>
<body class="bg-[#f8f1e9] text-[#3B2F2F]">
    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-9 h-9 bg-[#3B2F2F] rounded-2xl flex items-center justify-center">
                    <span class="text-white text-2xl font-bold">C</span>
                </div>
                <span class="font-semibold text-2xl">Cedro</span>
            </div>
            
            <a href="https://wa.me/12679053490" target="_blank" 
               class="px-5 py-2.5 text-sm font-medium border border-[#3B2F2F]/30 rounded-3xl hover:bg-[#3B2F2F] hover:text-white transition-all flex items-center gap-x-2">
                <i class="fa-brands fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="max-w-6xl mx-auto px-6 pt-16 pb-20 text-center">
        <div class="inline-flex items-center gap-x-2 bg-white px-4 h-8 rounded-3xl mb-6 border text-xs tracking-widest">
            GOVERNADOR VALADARES • MG
        </div>
        
        <h1 class="text-6xl md:text-7xl font-semibold heading-serif tracking-tighter leading-none">
            Carpintaria e<br>alvenaria com alma.
        </h1>
        
        <p class="mt-6 max-w-md mx-auto text-lg text-[#3B2F2F]/70">
            Projetos sob medida com acabamento impecável para quem valoriza qualidade de verdade.
        </p>
        
        <div class="mt-10">
            <button onclick="mostrarLoginGoogle()" 
                    class="px-9 py-4 bg-[#3B2F2F] text-white font-semibold rounded-3xl text-base">
                Faça seu orçamento agora
            </button>
        </div>
    </section>

    <!-- Google Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4">
            <div class="text-center">
                <h3 class="font-semibold text-xl">Entre com seu e-mail</h3>
                <p class="text-sm text-[#3B2F2F]/60 mt-1">para fazer seu orçamento</p>
            </div>
            
            <button onclick="fazerLoginGoogle()" 
                    class="mt-8 w-full flex items-center justify-center gap-x-3 border py-3.5 rounded-3xl hover:bg-stone-50 transition-all">
                <i class="fa-brands fa-google text-xl"></i>
                <span class="font-medium">Continuar com Google</span>
            </button>
            
            <div class="text-center mt-4 text-xs text-[#3B2F2F]/50">ou</div>
            
            <button onclick="pularLogin()" 
                    class="mt-3 w-full text-sm text-[#3B2F2F]/70">Pular e preencher manualmente</button>
        </div>
    </div>

    <!-- Briefing Form -->
    <section id="briefing" class="max-w-3xl mx-auto px-6 pb-24 hidden">
        <div class="bg-white rounded-3xl p-9 border shadow-xl">
            <div class="text-center mb-8">
                <div class="text-xs tracking-[2px] text-[#3B2F2F]/60">PASSO A PASSO</div>
                <h2 class="text-4xl font-semibold heading-serif mt-1">Briefing do Projeto</h2>
            </div>

            <form id="briefingForm" onsubmit="enviarParaWhatsApp(event)">
                <!-- Form fields (same as previous version) -->
                <div class="mb-8">
                    <div class="uppercase text-xs tracking-widest text-[#3B2F2F]/50 mb-3">DADOS DO CLIENTE</div>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="text-sm font-medium">Nome Completo *</label>
                            <input type="text" id="nome" required class="mt-1 w-full border border-[#3B2F2F]/20 px-5 py-3.5 rounded-3xl text-sm">
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="text-sm font-medium">E-mail *</label>
                                <input type="email" id="email" required class="mt-1 w-full border border-[#3B2F2F]/20 px-5 py-3.5 rounded-3xl text-sm">
                            </div>
                            <div>
                                <label class="text-sm font-medium">Telefone / WhatsApp *</label>
                                <input type="tel" id="telefone" required class="mt-1 w-full border border-[#3B2F2F]/20 px-5 py-3.5 rounded-3xl text-sm">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Other fields abbreviated for brevity -->
                <div class="mb-8">
                    <div class="uppercase text-xs tracking-widest text-[#3B2F2F]/50 mb-3">DETALHES DO PROJETO</div>
                    <div class="space-y-4">
                        <div>
                            <label class="text-sm font-medium">Tipo de Serviço *</label>
                            <select id="servico" required class="mt-1 w-full border border-[#3B2F2F]/20 px-5 py-3.5 rounded-3xl text-sm">
                                <option value="">Selecione...</option>
                                <option>Carpintaria sob medida</option>
                                <option>Alvenaria estrutural</option>
                                <option>Reforma completa</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="text-sm font-medium">Descreva seu projeto</label>
                            <textarea id="descricao" rows="3" class="mt-1 w-full border border-[#3B2F2F]/20 px-5 py-3.5 rounded-3xl text-sm"></textarea>
                        </div>
                    </div>
                </div>

                <button type="submit" 
                        class="mt-8 w-full py-4 bg-[#3B2F2F] text-white font-semibold rounded-3xl flex items-center justify-center gap-x-3 text-base">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>Enviar Briefing e Abrir WhatsApp</span>
                </button>
            </form>
        </div>
    </section>

    <script>
        function mostrarLoginGoogle() {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('loginModal').classList.add('flex');
        }
        
        function fazerLoginGoogle() {
            // Simulação de login Google
            document.getElementById('loginModal').classList.remove('flex');
            document.getElementById('loginModal').classList.add('hidden');
            
            // Preenche dados simulados
            document.getElementById('email').value = "cliente@gmail.com";
            document.getElementById('nome').value = "Cliente Google";
            
            document.getElementById('briefing').classList.remove('hidden');
            document.getElementById('briefing').scrollIntoView({behavior:'smooth'});
        }
        
        function pularLogin() {
            document.getElementById('loginModal').classList.remove('flex');
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('briefing').classList.remove('hidden');
            document.getElementById('briefing').scrollIntoView({behavior:'smooth'});
        }
        
        function enviarParaWhatsApp(e) {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const telefone = document.getElementById('telefone').value;
            const servico = document.getElementById('servico').value;
            const descricao = document.getElementById('descricao').value;

            let mensagem = `*Novo Briefing - Cedro*\n\n`;
            mensagem += `*Nome:* ${nome}\n`;
            mensagem += `*Email:* ${email}\n`;
            mensagem += `*Telefone:* ${telefone}\n`;
            mensagem += `*Serviço:* ${servico}\n`;
            mensagem += `*Descrição:* ${descricao}`;

            const url = `https://wa.me/12679053490?text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
